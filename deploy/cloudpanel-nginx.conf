# ==============================================================================
# Tool4SaaS — CloudPanel NGINX Vhost Template for Laravel 12 (PHP 8.3+)
# Paste this into CloudPanel -> Sites -> [Your Site] -> Vhost tab
# ==============================================================================

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name tool4saas.com www.tool4saas.com;
  {{root}}

  # Enforce non-www apex canonical
  if ($host = 'www.tool4saas.com') {
    return 301 https://tool4saas.com$request_uri;
  }

  {{nginx_access_log}}
  {{nginx_error_log}}

  # Enforce HTTPS redirect
  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }

  # Immutable caching for static assets
  location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Front controller routing for Laravel
  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  # PHP-FPM execution block
  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_hide_header X-Powered-By;
  }

  # Protect sensitive hidden files (.env, .git, .editorconfig)
  location ~ /\.(?!well-known).* {
    deny all;
  }
}
