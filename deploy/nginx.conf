# Production Nginx configuration for Tool4SaaS (Laravel 12 / PHP 8.3+)

# 1. HTTP to HTTPS redirect block (enforce canonical HTTPS apex domain)
server {
    listen 80;
    server_name tool4saas.com www.tool4saas.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Permanent 301 redirect all HTTP traffic to canonical HTTPS non-www
    location / {
        return 301 https://tool4saas.com$request_uri;
    }
}

# 2. Main HTTPS server block
server {
    listen 443 ssl http2;
    server_name tool4saas.com www.tool4saas.com;

    # Canonical host redirect (www -> non-www)
    if ($host = 'www.tool4saas.com') {
        return 301 https://tool4saas.com$request_uri;
    }

    # SSL Certificates (provisioned via Certbot Let's Encrypt on production VPS)
    # ssl_certificate /etc/letsencrypt/live/tool4saas.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tool4saas.com/privkey.pem;

    root /var/www/tool4saas/public;
    index index.php index.html;

    # Static assets caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Front controller routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM execution block
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
