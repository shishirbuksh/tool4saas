# Production Nginx configuration for Tool4SaaS (Laravel 12 / PHP 8.3+)

# 1. HTTP to HTTPS redirect block (enforce canonical HTTPS apex domain)
server {
    listen 80;
    server_name tool4saas.com www.tool4saas.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Permanent 301 redirect all HTTP traffic to canonical HTTPS non-www
    location / {
        return 301 https://tool4saas.com$request_uri;
    }
}

# 2. Main HTTPS server block
server {
    listen 443 ssl http2;
    server_name tool4saas.com www.tool4saas.com;

    # Canonical host redirect (www -> non-www)
    if ($host = 'www.tool4saas.com') {
        return 301 https://tool4saas.com$request_uri;
    }

    # Standard web root for CloudPanel / VPS deployment
    root /home/tool4saas/htdocs/tool4saas.com/public;
    index index.php index.html;

    client_max_body_size 16M;

    # Gzip Compression for optimal Core Web Vitals (LCP < 2.5s)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Open Graph dynamic image fallback (serve static if exists, else route to Laravel)
    location ^~ /og/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri /index.php?$query_string;
    }

    # Static assets caching (Vite hashed bundles and media)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Front controller routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM execution block
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-CF-Powered-By;
    }

    # Deny access to hidden files (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Deny direct access to sensitive file extensions
    location ~* \.(?:env|sqlite|sql|log|bak|orig|save|dist)$ {
        deny all;
    }
}
