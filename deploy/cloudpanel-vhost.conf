# CloudPanel Nginx + Varnish Vhost Configuration for Tool4SaaS
# Production Hostinger VPS / CloudPanel (PHP 8.3-FPM + Varnish Cache)

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.tool4saas.com;
  return 301 https://tool4saas.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name tool4saas.com www1.tool4saas.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  # Security Headers (WCAG 2.2 AAA & Production Best Practices)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Allow Let's Encrypt ACME verification
  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  # Block sensitive hidden files (.env, .git, etc.)
  location ~ /\.(?!well-known).* {
    deny all;
    return 404;
  }

  # Edge-Level 301: Strict English-Only Rule for legacy foreign language prefixes
  location ~* ^/(es|fr)(/.*)?$ {
    return 301 https://tool4saas.com$2;
  }

  # Edge-Level 301: Legacy tool and page redirects
  location = /loan-calculator { return 301 /emi-calculator; }
  location = /percentage-difference { return 301 /percentage-calculator; }
  location = /cmyk-converter { return 301 /color-converter; }
  location = /color-palette { return 301 /color-converter; }
  location = /color-shades-generator { return 301 /color-converter; }
  location = /random-hex-color { return 301 /color-converter; }
  location = /css-box-shadow-generator { return 301 /gradient-generator; }
  location = /css-border-radius-generator { return 301 /gradient-generator; }
  location = /css-clip-path-generator { return 301 /gradient-generator; }
  location = /random-string { return 301 /random-number; }
  location = /random-passphrase { return 301 /password-generator; }
  location = /dice-roller { return 301 /coin-flip; }
  location = /pdf-split { return 301 /pdf-merge; }
  location = /pdf-rotate { return 301 /pdf-merge; }
  location = /pdf-watermark { return 301 /pdf-merge; }
  location = /image-resizer { return 301 /image-compressor; }
  location = /image-cropper { return 301 /image-compressor; }
  location = /image-border { return 301 /image-compressor; }
  location = /freelance-gst-invoice-generator { return 301 /invoice-generator; }
  location = /quotation-generator { return 301 /document-generator; }
  location = /purchase-order-generator { return 301 /document-generator; }
  location = /receipt-generator { return 301 /document-generator; }
  location = /rent-receipt-generator { return 301 /document-generator; }
  location = /payslip-generator { return 301 /document-generator; }
  location = /offer-letter-generator { return 301 /document-generator; }
  location = /wifi-qr-generator { return 301 /qr-code-generator; }
  location = /hmac-generator { return 301 /hash-generator; }
  location = /text-reverser { return 301 /text-tools; }
  location = /text-cleaner { return 301 /text-tools; }
  location = /text-list { return 301 /text-tools; }
  location = /text-find-replace { return 301 /text-tools; }
  location = /keyword-density { return 301 /word-counter; }
  location = /readability-checker { return 301 /word-counter; }
  location = /roman-numeral { return 301 /number-to-words; }
  location = /ascii-converter { return 301 /number-to-words; }
  location = /base-converter { return 301 /number-to-words; }
  location = /file-size-converter { return 301 /unit-converter; }
  location = /open-graph-preview { return 301 /serp-preview; }
  location = /world-clock { return 301 /timezone-converter; }
  location = /countdown-timer { return 301 /date-calculator; }
  location = /work-days-calculator { return 301 /date-calculator; }
  location = /time-duration-calculator { return 301 /date-calculator; }
  location = /ideal-weight-calculator { return 301 /bmi-calculator; }
  location = /body-fat-calculator { return 301 /bmi-calculator; }
  location = /macro-calculator { return 301 /calorie-calculator; }
  location = /ovulation-calculator { return 301 /period-calculator; }
  location = /us-paycheck-calculator { return 301 /salary-calculator; }
  location = /svg-to-png-converter { return 301 /image-format-converter; }
  location = /guides { return 301 /blog; }

  {{settings}}

  include /etc/nginx/global_settings;

  location / {
    {{varnish_proxy_pass}}
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
  }

  # Open Graph: Serve static image from disk if exists, otherwise fallback to Laravel via Varnish
  location ^~ /og/ {
    try_files $uri @fallback_og;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
  }

  location @fallback_og {
    {{varnish_proxy_pass}}
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
  }

  # Fast delivery of static assets with immutable browser caching
  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name tool4saas.com www1.tool4saas.com;
  {{root}}

  try_files $uri $uri/ /index.php?$args;
  index index.php index.html;

  # Block sensitive hidden files on backend port as well
  location ~ /\.(?!well-known).* {
    deny all;
    return 404;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}
