# CloudPanel Nginx Vhost for Tool4SaaS (Laravel 12 / PHP 8.3+ with Varnish Cache)
# Copy & paste this into CloudPanel: Sites > tool4saas.com > Vhost

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.tool4saas.com;
  return 301 https://tool4saas.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name tool4saas.com www1.tool4saas.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  # --- CANONICAL & MULTI-LANGUAGE 301 REDIRECTS (INSTANT EDGE CACHING) ---
  # 1. 301 Redirect /index.html and /index.php to clean canonical root
  location = /index.html { return 301 /; }
  location = /index.php { return 301 /; }

  # 2. 301 Redirect all legacy multi-language prefixes (/fr, /es, /de, etc.) to English canonical
  rewrite ^/(?:es|fr|de|it|pt|ru|ja|zh|hi|ar|nl|pl|tr|vi|id)(?:/(.*))?$ /$1 permanent;

  # 3. Security: Deny direct access to .env, .git, etc.
  location ~ /\.(?!well-known).* {
    deny all;
    return 404;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  location / {
    {{varnish_proxy_pass}}
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name tool4saas.com www1.tool4saas.com;
  {{root}}

  # 301 Redirect /index.html and /index.php to clean root
  location = /index.html { return 301 /; }
  location = /index.php { return 301 /; }

  # Security: Deny direct access to .env, .git, etc.
  location ~ /\.(?!well-known).* {
    deny all;
    return 404;
  }

  try_files $uri $uri/ /index.php?$args;
  index index.php index.html;

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}
